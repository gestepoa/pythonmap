// 同步高亮最大边数快捷按钮状态
function syncMaxCapPresetButtons(capVal) {
  document.querySelectorAll('.max-cap-preset-btn').forEach(btn => {
    const btnCap = parseInt(btn.dataset.cap, 10);
    if (btnCap === capVal) {
      btn.classList.add('text-amber-400', 'border-amber-500/40');
      btn.classList.remove('text-gray-300', 'border-transparent');
    } else {
      btn.classList.remove('text-amber-400', 'border-amber-500/40');
      btn.classList.add('text-gray-300', 'border-transparent');
    }
  });
}

// 动态应用用户修改的最大边数上限
function applyUserMaxSidesCap(rawVal) {
  const parsed = parseInt(rawVal, 10);
  if (!Number.isFinite(parsed) || parsed < 3) {
    showToast('最大边数上限必须是不小于 3 的整数', 'error');
    maxSidesInput.value = userMaxSidesCap;
    return;
  }

  userMaxSidesCap = Math.min(10000, Math.max(3, parsed));
  maxSidesInput.value = userMaxSidesCap;
  syncMaxCapPresetButtons(userMaxSidesCap);

  if (!simplifier) return;

  pauseAnimation();
  simplifier.computeEvolutionAndMatch(
    renderer.logicalWidth,
    renderer.logicalHeight,
    userMaxSidesCap
  );

  sliderEl.max = simplifier.totalSides;
  const targetK = Math.min(currentSides, simplifier.totalSides);
  renderMilestonePills();
  updateView(targetK);

  const finalIoU = formatMatchPercentage(simplifier.iouScores.get(simplifier.totalSides) || 0);
  if (simplifier.totalSides < userMaxSidesCap) {
    showToast(`上限设为 ${userMaxSidesCap} 边：在 ${simplifier.totalSides} 边已提前完全匹配 (${finalIoU})`, 'success');
  } else {
    showToast(`已应用上限 ${userMaxSidesCap} 边：在 ${simplifier.totalSides} 边处实际匹配度为 ${finalIoU}`, 'info');
  }
}

// 渲染左侧里程碑快捷跳转按钮
function renderMilestonePills() {
  milestonePills.innerHTML = '';
  if (!simplifier) return;

  const startBtn = document.createElement('button');
  startBtn.className = 'px-2.5 py-1 text-[11px] font-mono rounded-md bg-[#272c35] hover:bg-amber-500 hover:text-gray-950 text-gray-300 transition';
  startBtn.textContent = '起点: 3 边';
  startBtn.addEventListener('click', () => {
    pauseAnimation();
    updateView(3);
  });
  milestonePills.appendChild(startBtn);

  simplifier.milestones.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'px-2.5 py-1 text-[11px] font-mono rounded-md bg-[#272c35] hover:bg-amber-500 hover:text-gray-950 text-gray-300 transition';
    btn.textContent = `${m.label}边`;
    btn.addEventListener('click', () => {
      pauseAnimation();
      updateView(m.k);
    });
    milestonePills.appendChild(btn);
  });

  const endIoU = simplifier.iouScores.get(simplifier.totalSides) || 0;
  const endBtn = document.createElement('button');
  endBtn.className = 'px-2.5 py-1 text-[11px] font-mono rounded-md bg-[#272c35] hover:bg-amber-500 hover:text-gray-950 text-amber-400/90 transition';
  endBtn.textContent = `终点: ${simplifier.totalSides}边 (${formatMatchPercentage(endIoU)})`;
  endBtn.addEventListener('click', () => {
    pauseAnimation();
    updateView(simplifier.totalSides);
  });
  milestonePills.appendChild(endBtn);
}

// 启动非线性（前慢后快）动画循环
function startAnimation(onCompleteCallback = null) {
  stopAnimationTimer();
  isPlaying = true;
  playBtn.innerHTML = '<span>⏸ 暂停</span>';

  function tick() {
    if (!isPlaying || !simplifier) return;
    const maxK = simplifier.totalSides;

    if (currentSides >= maxK) {
      isPlaying = false;
      playBtn.innerHTML = '<span>▶ 播放</span>';
      if (typeof onCompleteCallback === 'function') {
        onCompleteCallback();
      }
      return;
    }

    let nextK = currentSides + 1;
    let baseDelay = 420;

    if (currentSides < 10) {
      nextK = currentSides + 1;
      baseDelay = 420;
    } else if (currentSides < 25) {
      nextK = currentSides + 1;
      baseDelay = 175;
    } else if (currentSides < 60) {
      nextK = currentSides + 2;
      baseDelay = 85;
    } else {
      const jump = Math.max(1, Math.floor((currentSides - 40) * 0.085));
      nextK = Math.min(maxK, currentSides + jump);
      baseDelay = 45;
    }

    updateView(nextK);
    animTimer = setTimeout(tick, Math.max(16, baseDelay / speedMultiplier));
  }

  animTimer = setTimeout(tick, 380 / speedMultiplier);
}

function pauseAnimation() {
  stopAnimationTimer();
  isPlaying = false;
  playBtn.innerHTML = '<span>▶ 播放</span>';
}

function stopAnimationTimer() {
  if (animTimer) {
    clearTimeout(animTimer);
    animTimer = null;
  }
}

/**
 * ============================================================================
 * 完整演化视频录制引擎 (支持标清 720P / 高清 1080P / 超清 2K 原画选择)
 * ============================================================================
 */
const VIDEO_QUALITY_CONFIGS = {
  standard: { dpr: 1.35, bitrate: 6000000,  label: '标清 720P' },
  high:     { dpr: 2.0,  bitrate: 16000000, label: '高清 1080P' },
  ultra:    { dpr: 2.75, bitrate: 32000000, label: '超清 2K' }
};

function getSupportedMimeType() {
  const candidates = [
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  for (const type of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) {
      return type;
    }
  }
  return '';
}

function startFullVideoRecording() {
  if (!simplifier) {
    showToast('请先加载有效的多边形数据', 'error');
    return;
  }
  if (!window.MediaRecorder || !canvasEl.captureStream) {
    showToast('当前浏览器不支持 Canvas 视频录制功能，请使用现代 Chrome / Edge 浏览器', 'error');
    return;
  }

  const qualityKey = videoQualitySelect.value || 'high';
  const qConfig = VIDEO_QUALITY_CONFIGS[qualityKey] || VIDEO_QUALITY_CONFIGS.high;
  const mimeType = getSupportedMimeType();

  pauseAnimation();
  isRecordingVideo = true;
  recordedChunks = [];

  // 临时切换到录制对应的高清 DPR 分辨率
  renderer.dpr = qConfig.dpr;
  renderer.setupHiDPI();
  updateView(3, true);

  try {
    const stream = canvasEl.captureStream(60);
    const options = { videoBitsPerSecond: qConfig.bitrate };
    if (mimeType) options.mimeType = mimeType;

    mediaRecorder = new MediaRecorder(stream, options);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) {
        recordedChunks.push(e.data);
      }
    };

    mediaRecorder.onstop = () => {
      isRecordingVideo = false;
      // 恢复正常屏幕 DPR
      renderer.dpr = Math.max(window.devicePixelRatio || 1, 2);
      renderer.setupHiDPI();
      updateView(currentSides, false);

      // 恢复录制按钮 UI
      recordBtnText.textContent = '开始录制完整视频 (3边 → 终点)';
      recordVideoBtn.classList.remove('bg-amber-500', 'hover:bg-amber-400', 'text-gray-950');
      recordVideoBtn.classList.add('bg-rose-600', 'hover:bg-rose-500', 'text-white');
      recDot.classList.remove('animate-ping');
      statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 就绪';

      if (recordedChunks.length === 0) {
        showToast('未捕获到视频帧数据', 'error');
        return;
      }

      const finalMime = mediaRecorder.mimeType || mimeType || 'video/webm';
      const ext = finalMime.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(recordedChunks, { type: finalMime });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const cleanTitle = (currentRegionTitle || 'map').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-');
      link.href = url;
      link.download = `${cleanTitle}-evolution-${renderer.aspectKey.replace(':', 'x')}-${qualityKey}.${ext}`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);

      showToast(`完整视频录制完成！已导出 ${qConfig.label} 视频 (.${ext})`, 'success');
    };

    mediaRecorder.start(100);

    // 更新录制中按钮与状态栏 UI
    recordBtnText.textContent = '⏹ 正在录制中... (点击可提前结束并保存)';
    recordVideoBtn.classList.remove('bg-rose-600', 'hover:bg-rose-500', 'text-white');
    recordVideoBtn.classList.add('bg-amber-500', 'hover:bg-amber-400', 'text-gray-950');
    recDot.classList.add('animate-ping');
    statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span> 正在录制完整视频...';
    showToast(`开始录制 ${qConfig.label} 完整演化视频 (3 边 → ${simplifier.totalSides} 边)`, 'info');

    // 从第 3 条边停留 300ms 后启动完整动画；到达终点后持续强制重绘保持 2 秒（2000ms）再输出视频
    setTimeout(() => {
      if (!isRecordingVideo) return;
      startAnimation(() => {
        if (!isRecordingVideo) return;

        const finalSides = simplifier.totalSides;
        updateView(finalSides, true);
        recordBtnText.textContent = '⏹ 已达终点，画面保持 2 秒中...';

        const holdDurationMs = 2000;
        const holdStartTime = performance.now();

        function keepFinalFrameAlive(now) {
          if (!isRecordingVideo) return;

          // 每帧强制重绘一次终点画面，确保 captureStream 持续向视频编码器写入真实的终点帧
          renderer.render(
            simplifier,
            finalSides,
            showInternalToggle.checked,
            true
          );

          if (now - holdStartTime < holdDurationMs) {
            holdFrameRafId = requestAnimationFrame(keepFinalFrameAlive);
          } else {
            holdFrameRafId = null;
            stopVideoRecording();
          }
        }

        holdFrameRafId = requestAnimationFrame(keepFinalFrameAlive);
      });
    }, 300);
  } catch (err) {
    isRecordingVideo = false;
    renderer.dpr = Math.max(window.devicePixelRatio || 1, 2);
    renderer.setupHiDPI();
    updateView(currentSides, false);
    showToast('启动视频录制失败: ' + err.message, 'error');
  }
}

function cancelHoldFrameLoop() {
  if (holdFrameRafId !== null) {
    cancelAnimationFrame(holdFrameRafId);
    holdFrameRafId = null;
  }
}

function stopVideoRecording() {
  cancelHoldFrameLoop();
  pauseAnimation();
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try {
      mediaRecorder.requestData();
    } catch (e) {}
    mediaRecorder.stop();
  }
}

recordVideoBtn.addEventListener('click', () => {
  if (isRecordingVideo) {
    stopVideoRecording();
  } else {
    startFullVideoRecording();
  }
});

// 载入任意 GeoJSON 数据并初始化外边界提取（含岛屿与飞地）、算法与 Canvas
function loadGeoJSONData(geojson, regionTitle = 'ZAMBIA') {
  pauseAnimation();
  currentGeoJSON = geojson;
  currentRegionTitle = regionTitle;
  statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> 正在提取外边界与岛屿...';

  setTimeout(() => {
    try {
      const dissolveEnabled = dissolveToggle.checked;
      const result = extractAndProjectOuterBoundary(
        geojson,
        renderer.mapBounds,
        dissolveEnabled
      );

      const outerRings = result.outerRings;
      const totalPts = outerRings.reduce((sum, r) => sum + r.length, 0);
      if (outerRings.length === 0 || totalPts < 3) {
        showToast('该多边形有效顶点不足，无法进行渐进逼近演示', 'error');
        return;
      }

      const polyCount = outerRings.length;
      if (result.subRegionCount > 1 || polyCount > 1) {
        mergeInfoBadge.classList.remove('hidden');
        if (dissolveEnabled && result.subRegionCount > polyCount) {
          mergeInfoBadge.textContent = `${result.subRegionCount} 区块 → 融合为 ${polyCount} 个外边界(含岛屿/飞地)`;
        } else if (polyCount > 1) {
          mergeInfoBadge.textContent = `共 ${polyCount} 个独立多边形 (主陆 + ${polyCount - 1} 岛屿/飞地)`;
        } else {
          mergeInfoBadge.textContent = `已融合 ${result.subRegionCount} 个内部区块 → 1 个外边界`;
        }
        if (result.internalRingsProjected.length > 1) {
          showInternalWrapper.classList.remove('hidden');
        } else {
          showInternalWrapper.classList.add('hidden');
        }
      } else {
        mergeInfoBadge.classList.add('hidden');
        showInternalWrapper.classList.add('hidden');
        showInternalToggle.checked = false;
      }

      simplifier = new VisvalingamSimplifier(
        outerRings,
        result.internalRingsProjected,
        userMaxSidesCap
      );
      simplifier.computeEvolutionAndMatch(renderer.logicalWidth, renderer.logicalHeight, userMaxSidesCap);

      sliderEl.max = simplifier.totalSides;
      sliderEl.value = 3;

      renderMilestonePills();
      updateView(3);
      startAnimation();

      statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 就绪';
      const finalIoU = formatMatchPercentage(simplifier.iouScores.get(simplifier.totalSides) || 0);
      const stopReason = simplifier.totalSides < userMaxSidesCap
        ? `在 ${simplifier.totalSides} 边即完全匹配 (${finalIoU})`
        : `达上限 ${userMaxSidesCap} 边，实际匹配度 ${finalIoU}`;
      showToast(`已加载 ${regionTitle.toUpperCase()}：${stopReason}`, 'success');
    } catch (err) {
      console.error(err);
      showToast('解析 GeoJSON 失败: ' + err.message, 'error');
      statusBadge.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-400"></span> 解析异常';
    }
  }, 20);
}

// 加载预设国家或多行政区划示例
async function loadPresetCountry(countryName) {
  document.querySelectorAll('.preset-btn').forEach(btn => {
    if (btn.dataset.preset === countryName) {
      btn.classList.add('border-amber-500/50', 'text-white');
      btn.classList.remove('border-transparent', 'text-gray-200');
    } else {
      btn.classList.remove('border-amber-500/50', 'text-white');
      btn.classList.add('border-transparent', 'text-gray-200');
    }
  });

  if (countryName === 'MultiDistrictDemo') {
    const demoGeoJSON = buildMultiDistrictDemoGeoJSON();
    loadGeoJSONData(demoGeoJSON, 'PROVINCE');
    return;
  }

  try {
    if (!cachedWorldGeoJSON) {
      const response = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');
      if (response.ok) {
        cachedWorldGeoJSON = await response.json();
      }
    }
    if (cachedWorldGeoJSON && cachedWorldGeoJSON.features) {
      const target = cachedWorldGeoJSON.features.find(f => {
        const name = (f.properties.ADMIN || f.properties.name || '').toLowerCase();
        return name === countryName.toLowerCase();
      });
      if (target) {
        loadGeoJSONData(target, countryName);
        return;
      }
    }
  } catch (e) {
    // 网络受限时静默使用内置高精度轮廓数据
  }

  const fallback = buildProceduralCountryGeoJSON(countryName);
  loadGeoJSONData(fallback, countryName);
}

/**
 * ============================================================================
 * 6. 交互事件绑定（上传、拖拽、最大边数设置、播放控制、高清 PNG 导出）
 * ============================================================================
 */
function handleUploadedFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const json = JSON.parse(e.target.result);
      let name = file.name.replace(/\.(geo)?json$/i, '');

      if (json.name) {
        name = json.name;
      } else if (json.features && json.features.length === 1 && json.features[0]?.properties) {
        const p = json.features[0].properties;
        name = p.name || p.NAME || p.ADMIN || p.id || name;
      } else if (json.properties) {
        name = json.properties.name || json.properties.NAME || name;
      }
      loadGeoJSONData(json, name);
    } catch (err) {
      showToast('无效的 JSON / GeoJSON 文件格式', 'error');
    }
  };
  reader.readAsText(file);
}

  e.target.value = '';
});

  dropZone.classList.add('border-amber-400', 'bg-[#202631]');
});
dropZone.addEventListener('dragleave', () => {

});

document.querySelectorAll('.preset-btn').forEach(btn => {

document.querySelectorAll('.max-cap-preset-btn').forEach(btn => {

    if (simplifier && currentSides >= simplifier.totalSides) {

  updateView(3);
  startAnimation();
});

document.getElementById('step-prev-btn').addEventListener('click', () => {
  pauseAnimation();
  updateView(currentSides - 1);
});

document.getElementById('step-next-btn').addEventListener('click', () => {
  pauseAnimation();
  updateView(currentSides + 1);
});

sliderEl.addEventListener('input', (e) => {
  pauseAnimation();
  updateView(parseInt(e.target.value, 10));
});

document.getElementById('speed-select').addEventListener('change', (e) => {
  speedMultiplier = parseFloat(e.target.value) || 1.0;
});

// 导出当前 Canvas 为高清 PNG 海报（自动隐藏所有模块辅助虚线框）
document.getElementById('download-btn').addEventListener('click', () => {
  try {
    updateView(currentSides, true);
    const dataUrl = canvasEl.toDataURL('image/png');
    updateView(currentSides, false);

    const link = document.createElement('a');
    const cleanTitle = (currentRegionTitle || 'map').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-');
    link.download = `${cleanTitle}-${currentSides}-sides.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    link.remove();
    showToast(`已导出 ${currentSides} 边形高清海报 PNG`, 'success');
  } catch (err) {
    showToast('导出图片失败: ' + err.message, 'error');
  }
});

window.onload = async () => {
  if (document.fonts && document.fonts.ready) {

  }
  loadPresetCountry('Zambia');
};
